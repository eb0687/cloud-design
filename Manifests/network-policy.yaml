# Restrict inbound data-plane traffic while retaining the existing service DNS
# names and ports used by the application manifests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-db-ingress
spec:
  podSelector:
    matchLabels:
      app: inventory-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: inventory-app
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-db-ingress
spec:
  podSelector:
    matchLabels:
      app: billing-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: billing-app
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: billing-app
        - podSelector:
            matchLabels:
              app: api-gateway-app
      ports:
        - protocol: TCP
          port: 5672
