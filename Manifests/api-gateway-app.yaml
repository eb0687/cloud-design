apiVersion: v1
kind: Service
metadata:
  name: api-gateway-app
  labels:
    app: api-gateway-app
    observability.cloud-design.io/scrape: "true"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
spec:
  type: NodePort
  selector:
    app: api-gateway-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
        - name: api-gateway-app
          image: eb0687/api-gateway-app:monitoring-5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: BILLING_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_RABBITMQ_USER
            - name: BILLING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
