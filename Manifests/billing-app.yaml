apiVersion: v1
kind: Service
metadata:
  name: billing-app
  labels:
    app: billing-app
spec:
  clusterIP: None
  selector:
    app: billing-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
spec:
  serviceName: billing-app
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
        - name: billing-app
          image: eb0687/billing-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-app-config
          env:
            - name: BILLING_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_POSTGRES_USER
            - name: BILLING_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_POSTGRES_PASSWORD
            - name: BILLING_RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_RABBITMQ_USER
            - name: BILLING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: BILLING_RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
