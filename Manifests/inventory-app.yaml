apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  labels:
    app: inventory-app
spec:
  selector:
    app: inventory-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: eb0687/inventory-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-app-config
          env:
            - name: INVENTORY_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: INVENTORY_POSTGRES_USER
            - name: INVENTORY_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-credentials
                  key: INVENTORY_POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
