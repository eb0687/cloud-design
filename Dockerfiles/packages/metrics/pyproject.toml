[project]
name = "metrics"
version = "0.1.0"
description = "Prometheus metrics middleware for Cloud-Design services"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.26.0,<1.0.0",
]

[tool.uv.build-backend]
module-name = ["metrics"]
module-root = "src"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
