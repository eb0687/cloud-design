[project]
name = "crud-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/billing",
    "apps/gateway",
    "apps/inventory",
    "packages/*",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["apps", "packages"]
module-root = ""
namespace = true

[project.scripts]
inventory = "apps.inventory.main:main"
billing = "apps.billing.main:main"
gateway = "apps.gateway.main:main"
