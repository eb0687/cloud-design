image:
  name: hashicorp/terraform:1.15.0
  entrypoint: [""]

stages:
  - init
  - validate
  - plan

variables:
  TF_ROOT: terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

default:
  tags:
    - docker-ci

init:
  stage: init
  script:
    - terraform -chdir="$TF_ROOT" init -backend=false -input=false

validate:
  stage: validate
  script:
    - terraform -chdir="$TF_ROOT" init -backend=false -input=false
    - terraform -chdir="$TF_ROOT" fmt -check -recursive
    - terraform -chdir="$TF_ROOT" validate

plan:
  stage: plan
  script:
    - terraform -chdir="$TF_ROOT" init -backend=false -input=false
    - terraform -chdir="$TF_ROOT" plan -input=false -refresh=false
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
