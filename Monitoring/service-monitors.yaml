apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-app
  labels:
    release: monitoring
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: api-gateway-app
      observability.cloud-design.io/scrape: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
